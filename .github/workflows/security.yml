name: Security Scans

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  trufflehog:
    name: TruffleHog — Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Run TruffleHog (push / schedule — full scan)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  bandit:
    name: Bandit — Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (full report)
        run: |
          bandit -r api.py foundstone/ \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Fail on high severity findings
        run: |
          bandit -r api.py foundstone/ \
            --severity-level high \
            --confidence-level high

  osv-scanner:
    name: OSV Scanner — Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OSV Scanner
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan Python dependencies
        run: |
          osv-scanner --lockfile=requirements.txt --format=table
        continue-on-error: true

      - name: Scan npm dependencies
        run: |
          osv-scanner --lockfile=ui/package-lock.json --format=table
        continue-on-error: true

      - name: Fail on critical vulnerabilities (Python)
        run: |
          osv-scanner --lockfile=requirements.txt

      - name: Fail on critical vulnerabilities (npm)
        run: |
          osv-scanner --lockfile=ui/package-lock.json
